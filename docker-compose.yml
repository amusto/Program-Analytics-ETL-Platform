services:
  postgres:
    image: postgres:16-alpine
    container_name: pa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: program_analytics
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d program_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: pa_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://analytics:analytics@postgres:5432/program_analytics
      DATA_DIR: /app/data
    volumes:
      - ./backend:/app
      - ./data:/app/data
    ports:
      - "8000:8000"
    command: >
      bash -c "python -m app.etl.load_program_data &&
               uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pg_data:
